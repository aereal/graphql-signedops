---
name: CI
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
jobs:
  ok:
    runs-on: ubuntu-slim
    permissions: {}
    needs:
      - test
    if: failure()
    steps:
      - run: exit 1
  test:
    runs-on: ubuntu-24.04
    permissions:
      code-quality: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm ci
      - run: pnpm build
      - parallel:
          - run: pnpm test --coverage
          - run: pnpm lint
          - run: 'pnpm format:ci'
      - parallel:
        - uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
          with:
            file: coverage/cobertura-coverage.xml
            language: TypeScript
            label: coverage/app
            fail-on-error: false
        - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
          with:
            version: 'v0.75.8'
